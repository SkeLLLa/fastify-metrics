name: 'OSV'

on:
  push:
    branches: ['master']
  schedule:
    - cron: '30 22 * * 5'

permissions:
  contents: read

concurrency:
  group: osv-scheduled-${{ github.ref }}
  cancel-in-progress: false

jobs:
  scan-scheduled:
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@b1d267aea5211fa648d9d442fa64b90dbdcbdd36 # v2.7.0
    permissions:
      actions: read
      contents: read
      security-events: write
