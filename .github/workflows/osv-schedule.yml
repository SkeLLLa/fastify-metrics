name: 'OSV'

on:
  push:
    branches: ['master']
  schedule:
    - cron: '30 22 * * 5'

permissions:
  contents: read

concurrency:
  group: osv-scheduled-${{ github.ref }}
  cancel-in-progress: false

jobs:
  scan-scheduled:
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@32d3cd482bdadfb38b186c0ad1b031902d55d932 # v2.7.1
    permissions:
      actions: read
      contents: read
      security-events: write
