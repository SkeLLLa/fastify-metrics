<svg xmlns="http://www.w3.org/2000/svg" width="192" height="20" role="img" aria-label="Donate Ukraine: Sternenko Fund">
  <title>Donate Ukraine: Sternenko Fund</title>
  <linearGradient id="s" x2="0" y2="100%">
    <stop offset="0" stop-color="#fff" stop-opacity=".16"/>
    <stop offset="1" stop-color="#000" stop-opacity=".16"/>
  </linearGradient>
  <clipPath id="r">
    <rect width="192" height="20" rx="3" fill="#fff"/>
  </clipPath>
  <g clip-path="url(#r)">
    <rect width="66" height="20" fill="#101010"/>
    <rect x="66" width="6" height="20" fill="#ffd500"/>
    <rect x="72" width="120" height="20" fill="#2b2b2b"/>
    <rect width="192" height="20" fill="url(#s)"/>
  </g>
  <g font-family="Verdana,Geneva,DejaVu Sans,sans-serif" font-size="11" text-rendering="geometricPrecision">
    <text x="24" y="15" text-anchor="middle" fill="#fff">Donate</text>
    <g transform="translate(50 5)">
      <rect width="12" height="5" fill="#0057b8"/>
      <rect y="5" width="12" height="5" fill="#ffd700"/>
    </g>
    <text x="132" y="15" text-anchor="middle" fill="#fff">Sternenko Fund</text>
  </g>
</svg>
